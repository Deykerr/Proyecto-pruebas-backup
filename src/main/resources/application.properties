spring.application.name=Triggers

# Base de datos — local por defecto, Railway sobreescribe con DATABASE_URL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tienda}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.cache=false

# HikariCP - detectar BD caida rapidamente
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.keepalive-time=30000

# =============================================
# BACKUP EN LA NUBE - Google Drive
# =============================================
# Ruta al archivo credentials.json de Google Cloud Console
backup.drive.credentials-path=${DRIVE_CREDENTIALS_PATH:credentials.json}

# ID de la carpeta en Drive donde se guardan los backups
# (obtenerlo de la URL al abrir la carpeta en Drive)
backup.drive.folder-id=1WrbtoJlC-7FyRfR5g04PzpRl1XUiObYn

# Nombre base del archivo de backup en Drive
backup.drive.file-name=tienda_backup.json

# Cron: cada cuanto hacer backup automatico
# Formato: segundo minuto hora dia mes dia-semana
# "0 */2 * * * *"  = cada 2 minutos
# "0 */5 * * * *"  = cada 5 minutos
# "0 0 * * * *"    = cada hora
backup.cron=0 */2 * * * *

# Modo autenticacion Google Drive:
# false = OAuth2 Desktop (local, abre el navegador la primera vez)
# true  = Service Account (servidor Railway, sin navegador)
backup.drive.use-service-account=${USE_SERVICE_ACCOUNT:false}

# JSON de Service Account (solo en Railway, como variable de entorno)
# En local dejar vacio, en Railway pegar el contenido del JSON de la cuenta de servicio
backup.drive.service-account-json=${SERVICE_ACCOUNT_JSON:}